name: Refresh data

# Re-runs the model and republishes frontend/public/data during the NFL
# season. nflverse posts each day's stats the following morning, so this
# runs every morning Sept-Feb; it only commits when the data changed.
on:
  schedule:
    - cron: "17 13 * 1,2,9,10,11,12 *" # 13:17 UTC = 6:17 PT (5:17 PST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Backend tests
        run: python -m pytest -q backend/tests

      - name: Run the model and write site data
        run: python backend/precompute.py

      - name: Check published metrics
        run: python backend/check_metrics.py

      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- frontend/public/data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week=$(python -c "import json; print(json.load(open('frontend/public/data/meta.json'))['projection_week'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          git commit -m "data: refresh for week ${week}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Vercel deploys every push to the production branch by itself. If that
      # ever doesn't fire for bot commits, add a Deploy Hook URL as the
      # VERCEL_DEPLOY_HOOK repository secret and this step will trigger it.
      - name: Trigger Vercel deploy hook (optional)
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
